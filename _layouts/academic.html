<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meaghan White | University of Queensland EECS</title>
  <meta name="description" content="Academic homepage of Meaghan White, researcher in cyber-physical systems, machine learning for power systems, and director of SLOBBERDOG.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #faf8f5; /* warm gallery-like cream background */
      --text-color: #1a1a1a;
      --text-muted: #5a5a5a;
      --border-color: rgba(26, 26, 26, 0.08);
      --link-color: #a93c24; /* sophisticated brick/terracotta red */
      --link-hover-bg: rgba(169, 60, 36, 0.06);
      --font-display: 'Fraunces', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0b0c0e; /* deep midnight obsidian background */
        --text-color: #e4e6eb;
        --text-muted: #9da3af;
        --border-color: rgba(228, 230, 235, 0.08);
        --link-color: #f07b65;
        --link-hover-bg: rgba(240, 123, 101, 0.08);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-sans);
      font-size: 1.08rem;
      line-height: 1.85;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Animation on Page Load */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      min-height: 100vh;
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @media (min-width: 48em) {
      .main-grid {
        grid-template-columns: 350px 1fr;
      }
    }

    @media (min-width: 64em) {
      .main-grid {
        grid-template-columns: 420px 1fr;
      }
    }

    /* Left Sidebar Panel */
    .sidebar {
      padding: 4rem 2rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @media (min-width: 48em) {
      .sidebar {
        padding: 5rem 3.5rem;
        border-bottom: none;
        border-right: 1px solid var(--border-color);
        position: sticky;
        top: 0;
        height: 100vh;
      }
    }

    @media (min-width: 64em) {
      .sidebar {
        padding: 6rem 4.5rem;
      }
    }

    .brand h1 {
      font-family: var(--font-display);
      font-size: 2.6rem;
      font-weight: 300;
      line-height: 1.15;
      margin: 0 0 1rem 0;
      letter-spacing: -0.01em;
    }

    @media (min-width: 64em) {
      .brand h1 {
        font-size: 3.2rem;
      }
    }

    .brand .affiliation {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.2rem;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.4;
    }

    .contacts-list {
      margin-top: 3rem;
      padding: 0;
      list-style: none;
    }

    @media (min-width: 48em) {
      .contacts-list {
        margin-top: 0;
      }
    }

    .contacts-list li {
      margin: 0.8rem 0;
    }

    .contacts-list a {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: color 0.2s ease;
    }

    .contacts-list a:hover {
      color: var(--text-color);
    }

    .contacts-list a svg {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      fill: currentColor;
    }

    /* Main Content Panel */
    .content-area {
      padding: 3rem 2rem;
    }

    @media (min-width: 48em) {
      .content-area {
        padding: 5rem 4.5rem;
        display: flex;
        align-items: center;
      }
    }

    @media (min-width: 64em) {
      .content-area {
        padding: 6rem 7rem;
      }
    }

    .bio-wrapper {
      max-width: 650px;
    }

    .bio-text p {
      font-size: 1.12rem;
      line-height: 1.9;
      font-weight: 300;
      margin: 0 0 2rem 0;
      color: var(--text-color);
    }

    .bio-text p:last-child {
      margin-bottom: 0;
    }

    /* Text link animations */
    .bio-text a {
      color: var(--link-color);
      text-decoration: none;
      font-weight: 500;
      padding: 0 2px;
      border-bottom: 1px solid rgba(169, 60, 36, 0.2);
      transition: all 0.2s ease-in-out;
    }

    @media (prefers-color-scheme: dark) {
      .bio-text a {
        border-bottom-color: rgba(240, 123, 101, 0.2);
      }
    }

    .bio-text a:hover {
      background-color: var(--link-hover-bg);
      border-bottom-color: var(--link-color);
    }

    /* Footer / Copyright */
    .footer {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4rem;
      border-top: 1px solid var(--border-color);
      padding-top: 1.5rem;
    }

    @media (min-width: 48em) {
      .footer {
        display: none; /* hidden on desktop since sidebar handles copyright if needed, or we keep it clean */
      }
    }
  </style>
</head>
<body>
  <div class="main-grid">
    <aside class="sidebar">
      <div class="brand">
        <h1>Meaghan White</h1>
        <p class="affiliation">University of Queensland<br>School of EECS</p>
      </div>
      
      <ul class="contacts-list">
        <li>
          <a href="mailto:heymeg@protonmail.com" aria-label="Email Meaghan">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            Email
          </a>
        </li>
        <li>
          <a href="https://github.com/unmeg" target="_blank" rel="noopener" aria-label="GitHub Profile">
            <svg viewBox="0 0 24 24"><path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>
            GitHub
          </a>
        </li>
        <li>
          <a href="https://linkedin.com/in/whoismegwhite" target="_blank" rel="noopener" aria-label="LinkedIn Profile">
            <svg viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.779-1.75-1.75s.784-1.75 1.75-1.75 1.75.779 1.75 1.75-.784 1.75-1.75 1.75zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
            LinkedIn
          </a>
        </li>
      </ul>
    </aside>
    
    <main class="content-area">
      <div class="bio-wrapper">
        <div class="bio-text">
          {{ content }}
        </div>
        
        <div class="footer">
          &copy; {{ site.time | date: "%Y" }} Meaghan White
        </div>
      </div>
    </main>
  </div>
</body>
</html>
