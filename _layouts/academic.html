<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Meaghan White</title>
  <meta name="description" content="Academic landing page of Meaghan White - University of Queensland EECS.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #faf9f6;
      --text-color: #1c1c1c;
      --link-color: #8c2d19; /* elegant deep rust/red academic link color */
      --link-hover-color: #a63a24;
      --meta-color: #555;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --text-color: #e3e3e3;
        --link-color: #e57357;
        --link-hover-color: #ff8a65;
        --meta-color: #aaa;
      }
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 1.05rem;
      line-height: 1.75;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 6rem 1.5rem;
    }
    header {
      margin-bottom: 3.5rem;
    }
    h1 {
      font-family: 'Lora', Georgia, serif;
      font-size: 2.6rem;
      font-weight: 500;
      margin: 0 0 0.5rem 0;
      letter-spacing: -0.02em;
    }
    .affiliation {
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: 1.25rem;
      color: var(--meta-color);
      margin: 0;
    }
    .content p {
      margin-bottom: 1.8rem;
      font-weight: 300;
    }
    a {
      color: var(--link-color);
      text-decoration: none;
      border-bottom: 1px solid rgba(140, 45, 25, 0.15);
      transition: border-bottom-color 0.2s ease, color 0.2s ease;
    }
    @media (prefers-color-scheme: dark) {
      a {
        border-bottom-color: rgba(229, 115, 87, 0.15);
      }
    }
    a:hover {
      color: var(--link-hover-color);
      border-bottom: 1px solid var(--link-hover-color);
    }
    footer {
      margin-top: 5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      font-size: 0.9rem;
      color: var(--meta-color);
      display: flex;
      justify-content: space-between;
    }
    @media (prefers-color-scheme: dark) {
      footer {
        border-top-color: rgba(255, 255, 255, 0.06);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Meaghan White</h1>
      <p class="affiliation">University of Queensland &middot; School of EECS</p>
    </header>
    <main class="content">
      {{ content }}
    </main>
    <footer>
      <span>&copy; {{ site.time | date: "%Y" }} Meaghan White</span>
      <nav>
        <a href="mailto:heymeg@protonmail.com">Email</a> &middot;
        <a href="https://github.com/unmeg">GitHub</a> &middot;
        <a href="https://linkedin.com/in/whoismegwhite">LinkedIn</a>
      </nav>
    </footer>
  </div>
</body>
</html>
